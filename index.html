<style>
  html, body { font-family: 'Noto Sans TC', 'Inter', system-ui, -apple-system, sans-serif; }
  /* Periodic table grid */
  .pt-grid {
    display: grid;
    grid-template-columns: repeat(18, minmax(56px, 1fr));
    gap: 4px;
  }
  .pt-cell {
    aspect-ratio: 1 / 1;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.18s ease;
    user-select: none;
    position: relative;
  }
  .pt-cell:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    z-index: 5;
  }
  .pt-cell.dimmed { opacity: 0.18; }
  .pt-cell.highlighted { outline: 2px solid #1e293b; outline-offset: 1px; }
  .pt-cell .num { font-size: 9px; line-height: 1; opacity: 0.8; }
  .pt-cell .sym { font-size: 18px; font-weight: 700; line-height: 1; }
  .pt-cell .zh { font-size: 9px; line-height: 1; opacity: 0.85; }
  .pt-cell .mass { font-size: 7px; line-height: 1; opacity: 0.65; }
  /* Category colors */
  .cat-alkali       { background: #fda4af; color: #500724; }
  .cat-alkaline     { background: #fcd34d; color: #422006; }
  .cat-transition   { background: #fde68a; color: #422006; }
  .cat-posttrans    { background: #cbd5e1; color: #0f172a; }
  .cat-metalloid    { background: #bef264; color: #1a2e05; }
  .cat-nonmetal     { background: #86efac; color: #052e16; }
  .cat-halogen      { background: #67e8f9; color: #083344; }
  .cat-noble        { background: #c4b5fd; color: #1e1b4b; }
  .cat-lanthanide   { background: #f9a8d4; color: #500724; }
  .cat-actinide     { background: #fbcfe8; color: #500724; }
  .cat-unknown      { background: #d4d4d8; color: #18181b; }

  /* Lanthanide / Actinide marker rows */
  .pt-marker { background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 4px, #e2e8f0 4px, #e2e8f0 8px); color: #475569; font-size: 10px; }

  /* Mobile: shrink */
  @media (max-width: 900px) {
    .pt-grid { grid-template-columns: repeat(18, minmax(36px, 1fr)); gap: 2px; }
    .pt-cell { min-height: 36px; padding: 2px; }
    .pt-cell .num { font-size: 7px; }
    .pt-cell .sym { font-size: 12px; }
    .pt-cell .zh, .pt-cell .mass { display: none; }
  }
  @media (max-width: 640px) {
    .pt-wrap { overflow-x: auto; }
    .pt-grid { min-width: 720px; }
  }

  /* Tab styling */
  .tab-btn { transition: all 0.18s ease; }
  .tab-btn.active { background: #1e293b; color: #fff; }
  .tab-btn:not(.active):hover { background: #e2e8f0; }

  /* Slide-in detail panel */
  .detail-panel {
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
  }
  .detail-panel.closed { transform: translateX(100%); opacity: 0; pointer-events: none; }
  @media (max-width: 768px) {
    .detail-panel.closed { transform: translateY(100%); }
  }

  /* Code-like input for formulas */
  .formula-input {
    font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
    letter-spacing: 0.02em;
  }

  /* Quiz card animations */
  .quiz-option { transition: all 0.15s ease; }
  .quiz-option:hover:not(:disabled) { background: #f1f5f9; transform: translateY(-1px); }
  .quiz-option.correct { background: #86efac !important; color: #052e16; }
  .quiz-option.wrong { background: #fca5a5 !important; color: #450a0a; }

/* ============================================================
 * 化學式 parser（支援巢狀括號）
 * 回傳 { atoms: { 'H': 2, 'O': 1 }, error: null }
 * ============================================================ */
function parseFormula(input) {
  const f = input.replace(/\s+/g, "");
  if (!f) return { atoms: null, error: "empty" };
  let i = 0;
  function parseSegment(stopChar) {
    const atoms = {};
    while (i < f.length && f[i] !== stopChar) {
      const ch = f[i];
      if (ch === "(") {
        i++;
        const inner = parseSegment(")");
        if (inner.error) return inner;
        if (f[i] !== ")") return { atoms: null, error: "missing )" };
        i++;
        const mult = readNumber();
        for (const k in inner.atoms) atoms[k] = (atoms[k] || 0) + inner.atoms[k] * mult;
      } else if (/[A-Z]/.test(ch)) {
        // try 2-letter symbol first
        let sym = ch;
        if (i + 1 < f.length && /[a-z]/.test(f[i+1])) sym += f[i+1];
        // longest-match against known symbols (handles 3-letter symbols Uut etc., but our table tops at 2)
        if (!SYMBOL_TO_ELEMENT[sym] && sym.length === 2) {
          // fallback: maybe just 1-letter
          if (SYMBOL_TO_ELEMENT[ch]) {
            sym = ch;
            i += 1;
          } else {
            return { atoms: null, error: "symbol:" + sym };
          }
        } else if (!SYMBOL_TO_ELEMENT[sym]) {
          return { atoms: null, error: "symbol:" + sym };
        } else {
          i += sym.length;
        }
        const mult = readNumber();
        atoms[sym] = (atoms[sym] || 0) + mult;
      } else {
        return { atoms: null, error: "char:" + ch };
      }
    }
    return { atoms, error: null };
  }
  function readNumber() {
    let s = "";
    while (i < f.length && /[0-9]/.test(f[i])) { s += f[i]; i++; }
    return s ? parseInt(s, 10) : 1;
  }
  const result = parseSegment(null);
  if (result.error) return result;
  return { atoms: result.atoms, error: null };
}

/* ============================================================
 * 反應式單側解析：「2H2 + O2」 → { H: 4, O: 2 }
 * ============================================================ */
function parseSide(input) {
  const parts = input.split("+").map(s => s.trim()).filter(Boolean);
  if (!parts.length) return { atoms: null, error: "empty" };
  const total = {};
  for (const part of parts) {
    // 可選前置係數，如 "2H2O"、"3 Fe2O3"
    const m = part.match(/^([0-9]*)\s*(.+)$/);
    const coef = m[1] ? parseInt(m[1], 10) : 1;
    const formula = m[2];
    const r = parseFormula(formula);
    if (r.error) return { atoms: null, error: r.error + " in " + formula };
    for (const k in r.atoms) total[k] = (total[k] || 0) + r.atoms[k] * coef;
  }
  return { atoms: total, error: null };
}

/* ============================================================
 * 計算分子量
 * ============================================================ */
function molarMass(atoms) {
  let total = 0;
  const breakdown = [];
  for (const sym in atoms) {
    const el = SYMBOL_TO_ELEMENT[sym];
    if (!el) return { total: 0, breakdown: [], error: sym };
    const contrib = el.am * atoms[sym];
    total += contrib;
    breakdown.push({ sym, count: atoms[sym], am: el.am, contrib });
  }
  // sort by contribution desc
  breakdown.sort((a, b) => b.contrib - a.contrib);
  return { total, breakdown, error: null };
}

/* ============================================================
 * 工具函數：年份顯示（負數 → BC）
 * ============================================================ */
function fmtYear(y, t) {
  if (y == null) return t.notAvail;
  if (y < 0) return Math.abs(y) + " " + t.yearBC;
  return String(y);
}
function fmtNum(v, suffix) {
  if (v == null) return "—";
  return (typeof v === "number" ? v.toLocaleString("en-US", { maximumFractionDigits: 4 }) : v) + (suffix || "");
}

/* ============================================================
 * 週期表主視圖

function PeriodicTableView({ t, lang }) {
  const [selected, setSelected] = useState(null);
  const [hoverEl, setHoverEl] = useState(null);
  const [filterCat, setFilterCat] = useState("all");
  const [filterBlock, setFilterBlock] = useState("all");
  const [filterPhase, setFilterPhase] = useState("all");

  // Build a sparse 2D grid: rows 1-7 = periods 1-7; rows 9-10 = lanthanide / actinide
  // Special handling for La (57) → put marker "*" at (6, 3); Ac (89) → "**" at (7, 3)
  const grid = useMemo(() => {
    const g = Array.from({ length: 10 }, () => Array(18).fill(null));
    for (const el of ELEMENTS) {
      let row, col;
      if (el.n >= 57 && el.n <= 71) { row = 8; col = el.n - 57 + 2; }       // lanthanides row 9 (index 8), col 3..17
      else if (el.n >= 89 && el.n <= 103) { row = 9; col = el.n - 89 + 2; } // actinides row 10 (index 9), col 3..17
      else { row = el.p - 1; col = el.g - 1; }
      g[row][col] = el;
    }
    return g;
  }, []);

  const isDimmed = useCallback((el) => {
    if (!el) return false;
    if (filterCat !== "all" && el.c !== filterCat) return true;
    if (filterBlock !== "all" && el.b !== filterBlock) return true;
    if (filterPhase !== "all" && el.ph !== filterPhase) return true;
    return false;
  }, [filterCat, filterBlock, filterPhase]);

  const isHighlighted = useCallback((el) => {
    if (!el || !hoverEl) return false;
    if (el === hoverEl) return false; // self handled by hover style
    return el.p === hoverEl.p || el.g === hoverEl.g;
  }, [hoverEl]);

  const clearFilter = filterCat !== "all" || filterBlock !== "all" || filterPhase !== "all";

  return (
    <div className="space-y-4">
      {/* Filters */}
      <div className="flex flex-wrap items-center gap-3 text-sm">
        <FilterSelect label={t.filterCat} value={filterCat} onChange={setFilterCat} options={[
          ["all", t.catAll],
          ...CAT_ORDER.map(k => [k, t.cat[k]])
        ]} />
        <FilterSelect label={t.filterBlock} value={filterBlock} onChange={setFilterBlock} options={[
          ["all", t.block.all], ["s", t.block.s], ["p", t.block.p], ["d", t.block.d], ["f", t.block.f],
        ]} />
        <FilterSelect label={t.filterPhase} value={filterPhase} onChange={setFilterPhase} options={[
          ["all", t.phase.all], ["solid", t.phase.solid], ["liquid", t.phase.liquid], ["gas", t.phase.gas], ["synthetic", t.phase.synthetic],
        ]} />
        {clearFilter && (
          <button onClick={() => { setFilterCat("all"); setFilterBlock("all"); setFilterPhase("all"); }}
            className="text-slate-600 hover:text-slate-900 underline">
            {t.clearFilter}
          </button>
        )}
      </div>

      {/* Table */}
      <div className="pt-wrap">
        <div className="pt-grid">
          {grid.flat().map((el, idx) => {
            const row = Math.floor(idx / 18);
            const col = idx % 18;
            // Period 6 column 3 → lanthanide marker
            if (row === 5 && col === 2) {
              return (
                <div key={idx} className="pt-cell pt-marker flex flex-col items-center justify-center"
                     title={t.lanthanideMarker}>
                  <span style={{fontSize:'14px'}}>*</span>
                  <span style={{fontSize:'8px'}}>57–71</span>
                </div>
              );
            }
            if (row === 6 && col === 2) {
              return (
                <div key={idx} className="pt-cell pt-marker flex flex-col items-center justify-center"
                     title={t.actinideMarker}>
                  <span style={{fontSize:'14px'}}>**</span>
                  <span style={{fontSize:'8px'}}>89–103</span>
                </div>
              );
            }
            // Spacer between row 7 and lanthanide row → render empty in row 7 col 0
            if (row === 7) return <div key={idx} />;
            if (!el) return <div key={idx} />;
            const dim = isDimmed(el);
            const hi = isHighlighted(el);
            return (
              <div
                key={idx}
                className={`pt-cell ${CAT_CLASS[el.c]} ${dim ? "dimmed" : ""} ${hi ? "highlighted" : ""}`}
                onClick={() => setSelected(el)}
                onMouseEnter={() => setHoverEl(el)}
                onMouseLeave={() => setHoverEl(null)}
                title={`${el.n} ${el.s} ${lang === 'zh' ? el.zh : el.en}`}
              >
                <div className="flex justify-between items-start">
                  <span className="num">{el.n}</span>
                  <span className="num" style={{fontSize:'8px', opacity:0.7}}>{el.b}</span>
                </div>
                <div className="sym">{el.s}</div>
                <div>
                  <div className="zh">{lang === 'zh' ? el.zh : el.en.length > 7 ? el.en.slice(0,6)+'…' : el.en}</div>
                  <div className="mass">{el.am}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Legend */}
      <div className="border-t border-slate-200 pt-4">
        <p className="text-xs font-semibold text-slate-700 mb-2">{t.legendTitle}</p>
        <div className="flex flex-wrap gap-2 text-xs">
          {CAT_ORDER.map(k => (
            <span key={k} className={`px-2 py-1 rounded-md ${CAT_CLASS[k]}`}>
              {t.cat[k]}
            </span>
          ))}
        </div>
      </div>

      {/* Detail panel */}
      <div className={`fixed top-0 right-0 h-full w-full md:w-96 bg-white shadow-2xl z-50 detail-panel ${selected ? "" : "closed"} overflow-y-auto`}>
        {selected && <ElementDetail el={selected} t={t} lang={lang} onClose={() => setSelected(null)} />}
      </div>
      {selected && (
        <div className="fixed inset-0 bg-black/30 z-40 md:hidden" onClick={() => setSelected(null)} />
      )}
    </div>
  );
}

/* ============================================================

 * ============================================================ */
const MOLAR_SAMPLES = ["H2O", "NaCl", "C6H12O6", "Ca(OH)2", "Al2(SO4)3", "CH3COOH", "Fe2O3", "K3PO4"];

function MolarMassView({ t, lang }) {
  const [input, setInput] = useState("H2O");
  const [result, setResult] = useState(() => computeMolar("H2O", t));

  function computeMolar(formula, tStr) {
    if (!formula.trim()) return { error: tStr.molarErrEmpty };
    const r = parseFormula(formula);
    if (r.error) {
      if (r.error.startsWith("symbol:")) return { error: tStr.molarErrSymbol + r.error.slice(7) };
      return { error: tStr.molarErrParse + r.error };
    }
    const m = molarMass(r.atoms);
    if (m.error) return { error: tStr.molarErrSymbol + m.error };
    return { total: m.total, breakdown: m.breakdown, formula };
  }

  function onSubmit(e) {
    e.preventDefault();
    setResult(computeMolar(input, t));
  }

  return (
    <div className="max-w-3xl space-y-4">
      <div>

          autoFocus
        />
        <button type="submit" className="bg-slate-900 text-white px-4 py-2 rounded-md hover:bg-slate-700 font-medium">
          {t.molarCompute}
        </button>
      </form>

        <span>{t.molarSamples}</span>
        {MOLAR_SAMPLES.map(s => (
          <button key={s} onClick={() => { setInput(s); setResult(computeMolar(s, t)); }}
                  className="formula-input px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded">
            {s}
          </button>
        ))}
      </div>

      {result && result.error && (
        <div className="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-md text-sm">

        </div>
      )}

            <span className="text-sm text-slate-500">{t.molarResult}</span>

            <span className="text-base text-slate-500">{t.molarUnit}</span>
          </div>
          <div className="formula-input text-sm text-slate-600 mt-1">{result.formula}</div>

          <div className="mt-5">
            <div className="text-xs uppercase tracking-wider text-slate-500 mb-2">{t.molarComposition}</div>
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-slate-500 uppercase border-b border-slate-200">

                  <th className="text-left py-2 font-medium">{lang === 'zh' ? '元素' : 'Element'}</th>
                  <th className="text-right py-2 font-medium">{lang === 'zh' ? '原子數' : 'Count'}</th>
                  <th className="text-right py-2 font-medium">{t.detailMass}</th>
                  <th className="text-right py-2 font-medium">{lang === 'zh' ? '貢獻' : 'Contrib.'}</th>
                  <th className="text-right py-2 font-medium">{t.molarPercent}</th>
                </tr>
              </thead>
              <tbody>

/* ============================================================
 * 反應式守恆驗證
 * ============================================================ */
const REACT_SAMPLES = [
  ["CH4 + 2O2", "CO2 + 2H2O"],
  ["2H2 + O2", "2H2O"],
  ["N2 + 3H2", "2NH3"],
  ["2Al + 3CuSO4", "Al2(SO4)3 + 3Cu"],
  ["H2 + O2", "H2O"], // 故意不平衡
];

function ReactionView({ t, lang }) {
  const [left, setLeft] = useState("CH4 + 2O2");
  const [right, setRight] = useState("CO2 + 2H2O");
  const [result, setResult] = useState(null);

  // 自動驗證：每次 left / right 變動就重算（避免 setState 非同步 closure 陷阱）
  useEffect(() => {
    const L = parseSide(left);
    const R = parseSide(right);
    if (L.error || R.error) {
      setResult({ error: (L.error || R.error) });
      return;
    }
    const atoms = new Set([...Object.keys(L.atoms), ...Object.keys(R.atoms)]);
    const rows = [];
    let balanced = true;
    for (const a of atoms) {
      const lc = L.atoms[a] || 0;
      const rc = R.atoms[a] || 0;
      const diff = lc - rc;
      if (diff !== 0) balanced = false;
      rows.push({ atom: a, left: lc, right: rc, diff });
    }
    rows.sort((a, b) => a.atom.localeCompare(b.atom));
    setResult({ balanced, rows });
  }, [left, right]);

  function onSubmit(e) { e.preventDefault(); /* useEffect 已自動運算，這裡只防 form 跳頁 */ }

  return (
    <div className="max-w-3xl space-y-4">
      <div>
        <h2 className="text-xl font-bold text-slate-900">{t.reactTitle}</h2>
        <p className="text-sm text-slate-500 mt-1">{t.reactSubtitle}</p>
      </div>

      <form onSubmit={onSubmit} className="space-y-3">
        <div>
          <label className="text-xs uppercase tracking-wider text-slate-500 block mb-1">{t.reactLeft}</label>
          <input type="text" value={left} onChange={e => setLeft(e.target.value)}
                 placeholder={t.reactPlaceholderLeft}
                 className="formula-input w-full border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400" />
        </div>
        <div className="text-center text-2xl text-slate-400">→</div>
        <div>
          <label className="text-xs uppercase tracking-wider text-slate-500 block mb-1">{t.reactRight}</label>
          <input type="text" value={right} onChange={e => setRight(e.target.value)}
                 placeholder={t.reactPlaceholderRight}
                 className="formula-input w-full border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400" />
        </div>
        <button type="submit" className="bg-slate-900 text-white px-4 py-2 rounded-md hover:bg-slate-700 font-medium">
          {t.reactVerify}
        </button>
      </form>

      <div className="text-xs text-slate-500 flex flex-wrap gap-2 items-center">
        <span>{t.reactSamples}</span>
        {REACT_SAMPLES.map(([l, r], i) => (
          <button key={i} onClick={() => { setLeft(l); setRight(r); }}
                  className="formula-input px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded">
            {l} → {r}
          </button>
        ))}
      </div>

      {result && result.error && (
        <div className="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-md text-sm">
          {result.error}
        </div>
      )}

      {result && !result.error && (
        <div className={`border rounded-lg p-5 ${result.balanced ? "bg-emerald-50 border-emerald-200" : "bg-amber-50 border-amber-200"}`}>
          <div className={`font-semibold mb-3 ${result.balanced ? "text-emerald-800" : "text-amber-800"}`}>
            {result.balanced ? t.reactBalanced : t.reactNotBalanced}
          </div>
          <table className="w-full text-sm">
            <thead>
              <tr className="text-xs text-slate-500 uppercase border-b border-slate-300">
                <th className="text-left py-2 font-medium">{t.reactAtom}</th>
                <th className="text-right py-2 font-medium">{t.reactColLeft}</th>
                <th className="text-right py-2 font-medium">{t.reactColRight}</th>
                <th className="text-right py-2 font-medium">{t.reactDiff}</th>
              </tr>
            </thead>
            <tbody>
              {result.rows.map(r => {
                const el = SYMBOL_TO_ELEMENT[r.atom];
                return (
                  <tr key={r.atom} className="border-b border-slate-200/70">
                    <td className="py-2">
                      <span className={`inline-block px-2 py-0.5 rounded ${el ? CAT_CLASS[el.c] : 'cat-unknown'} font-bold`}>{r.atom}</span>
                      {el && <span className="ml-2 text-slate-600">{lang === 'zh' ? el.zh : el.en}</span>}
                    </td>

                    <td className={`py-2 text-right tabular-nums font-semibold ${r.diff === 0 ? "text-emerald-700" : "text-amber-700"}`}>
                      {r.diff > 0 ? `+${r.diff}` : r.diff}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

const QUIZ_TOTAL = 10;
const QUIZ_MODES = ["symbol", "name", "number"];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestion(mode, lang) {
  // Pick from the first 86 elements (commonly known); avoid synthetic-only
  const pool = ELEMENTS.filter(e => e.n <= 86);
  const correct = pool[Math.floor(Math.random() * pool.length)];
  const distractorPool = pool.filter(e => e.n !== correct.n);
  const distractors = shuffle(distractorPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]);
  let prompt = "", correctText = "";
  if (mode === "symbol") {
    prompt = "promptSymbol"; // build text in render
    correctText = lang === "zh" ? correct.zh : correct.en;
  } else if (mode === "name") {
    prompt = "promptName";
    correctText = correct.s;
  } else {
    prompt = "promptNumber";
    correctText = lang === "zh" ? correct.zh : correct.en;
  }
  return { mode, correct, options, promptKey: prompt };
}

function QuizView({ t, lang }) {
  const [mode, setMode] = useState("symbol");
  const [phase, setPhase] = useState("idle"); // idle | playing | done
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [picked, setPicked] = useState(null);
  const [answers, setAnswers] = useState([]);

  function start() {
    const qs = Array.from({ length: QUIZ_TOTAL }, () => buildQuestion(mode, lang));
    setQuestions(qs);
    setIdx(0);
    setScore(0);
    setPicked(null);
    setAnswers([]);
    setPhase("playing");
  }

  function pick(option) {
    if (picked) return;
    const q = questions[idx];
    const isCorrect = option.n === q.correct.n;
    setPicked(option.n);
    setAnswers(prev => [...prev, { q, picked: option, correct: isCorrect }]);
    if (isCorrect) setScore(s => s + 1);
  }

  function next() {
    if (idx + 1 >= QUIZ_TOTAL) {
      setPhase("done");
    } else {
      setIdx(idx + 1);
      setPicked(null);
    }
  }

  // idle screen
  if (phase === "idle") {
    return (
      <div className="max-w-xl space-y-4">
        <h2 className="text-xl font-bold text-slate-900">{t.quizTitle}</h2>
        <div className="space-y-2">
          {QUIZ_MODES.map(m => (
            <label key={m} className="flex items-center gap-3 px-4 py-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer">
              <input type="radio" name="mode" value={m} checked={mode === m} onChange={() => setMode(m)} />
              <span>{m === "symbol" ? t.quizModeSymbol : m === "name" ? t.quizModeName : t.quizModeNumber}</span>
            </label>
          ))}
        </div>
        <button onClick={start} className="bg-slate-900 text-white px-6 py-2.5 rounded-md hover:bg-slate-700 font-medium">
          {t.quizStart}
        </button>
      </div>
    );
  }

  // done screen
  if (phase === "done") {
    return (
      <div className="max-w-2xl space-y-4">
        <h2 className="text-xl font-bold text-slate-900">{t.quizResult}</h2>
        <div className="bg-white border border-slate-200 rounded-lg p-6 text-center">
          <div className="text-5xl font-bold text-slate-900">{score} <span className="text-2xl text-slate-400">/ {QUIZ_TOTAL}</span></div>
          <div className="text-sm text-slate-500 mt-2">
            {t.quizCorrect}: {score} · {t.quizWrong}: {QUIZ_TOTAL - score}
          </div>
        </div>
        <div className="bg-white border border-slate-200 rounded-lg divide-y divide-slate-200">
          {answers.map((a, i) => (
            <div key={i} className="p-3 flex items-center gap-3">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${a.correct ? "bg-emerald-200 text-emerald-900" : "bg-red-200 text-red-900"}`}>{a.correct ? "✓" : "✗"}</span>
              <div className="flex-1 text-sm">
                <span className="text-slate-500">Q{i+1}：</span>
                <span className="font-mono">{a.q.correct.s}</span>
                <span className="text-slate-500"> · {lang === 'zh' ? a.q.correct.zh : a.q.correct.en}</span>
              </div>
              {!a.correct && (
                <span className="text-xs text-red-600">→ {a.picked.s} / {lang === 'zh' ? a.picked.zh : a.picked.en}</span>
              )}
            </div>
          ))}
        </div>
        <button onClick={() => setPhase("idle")} className="bg-slate-900 text-white px-6 py-2.5 rounded-md hover:bg-slate-700 font-medium">
          {t.quizRestart}
        </button>
      </div>
    );
  }

  // playing screen
  const q = questions[idx];
  const promptText = q.promptKey === "promptSymbol" ? t.quizPromptSymbol.replace("{sym}", q.correct.s)
                   : q.promptKey === "promptName"    ? t.quizPromptNameZh.replace("{zh}", lang === 'zh' ? q.correct.zh : q.correct.en)
                   : t.quizPromptNumber.replace("{n}", q.correct.n);

  return (
    <div className="max-w-xl space-y-4">
      <div className="flex justify-between items-baseline">
        <span className="text-sm text-slate-500">{t.quizQuestion} {idx + 1} / {QUIZ_TOTAL}</span>
        <span className="text-sm text-slate-500">{t.quizScore}: <span className="font-bold text-slate-900">{score}</span></span>
      </div>
      <div className="bg-white border border-slate-200 rounded-lg p-6">
        <p className="text-lg font-medium text-slate-900 mb-5">{promptText}</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          {q.options.map(opt => {
            const isCorrect = opt.n === q.correct.n;
            const isPicked = picked === opt.n;
            const showResult = picked != null;
            const cls = !showResult ? "" : isCorrect ? "correct" : (isPicked ? "wrong" : "");
            const label = q.promptKey === "promptName" ? opt.s : (lang === "zh" ? opt.zh : opt.en);
            return (
              <button key={opt.n}
                      disabled={showResult}
                      onClick={() => pick(opt)}
                      className={`quiz-option border border-slate-200 rounded-md px-4 py-3 text-left ${cls}`}>
                <span className="font-mono text-xs text-slate-500 mr-2">{opt.n}</span>
                {label}
              </button>
            );
          })}
        </div>
        {picked != null && (
          <div className="mt-4 pt-4 border-t border-slate-200 text-sm">
            <span className="text-slate-500">{t.quizCorrectAnswer}</span>
            <span className="font-mono font-bold">{q.correct.s}</span>
            <span> · {lang === 'zh' ? q.correct.zh : q.correct.en}</span>
            <button onClick={next} className="float-right bg-slate-900 text-white px-4 py-1.5 rounded-md hover:bg-slate-700 text-sm font-medium">
              {idx + 1 >= QUIZ_TOTAL ? t.quizFinish : t.quizNext}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
 * 啟動
 * ============================================================ */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
